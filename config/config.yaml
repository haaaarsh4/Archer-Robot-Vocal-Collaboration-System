audio:
  sample_rate: 44100
  frame_size: 1024
  channels: 1
  dtype: float32
  input_device: null
  output_device: null

preprocessing:
  silence_threshold_db: -40
  normalize_target_rms: 0.1

pitch:
  method: yin                      
  confidence_threshold: 0.3
  min_frequency: 65               
  max_frequency: 1200
  tolerance: 0.15                  
  jump_tolerance_cents: 80.0       # how far a reading can drift before it's treated as a new note rather than smoothed in

rhythm:
  onset_threshold: 0.1
  min_bpm: 40
  max_bpm: 240
  phrase_end_silence_ms: 800

harmony:
  detune_cents: 0
  scale_lock: true
  default_mode: unison_shadowing        # which mode plays when no special condition applies
  fusion_mode: false                     # triadic harmony is opt-in only — never the default
  fast_tempo_threshold_bpm: 120          # above this tempo, prefer contour-following
  sustain_frames_for_timbral: 30         # notes held this many frames shift to timbral thickening
  silence_when_no_singer: false          # true = go silent (not drone) when Archer stops

modes:
  octave_direction: -1                   # -1 = octave below, +1 = octave above
  delay_beats: 1.0                       # how many beats behind for delayed_response
  drone_divisor: 2                       # 2 = sub-octave drone, 4 = two octaves down
  contour_window: 6                      # frames of pitch history for contour direction
  contour_step_semitones: 2              # step size when following melodic contour
  call_response_semitones: 0             # interval offset for the response phrase

protocol:
  start_enabled: true
  sensitive_phoneme_classes: []          # fill in as Archer identifies protocol-sensitive vocables
  sound_cue_enabled: true
  sound_cue_hz_range: [80, 140]          # low-register range for the toggle gesture
  sound_cue_repetitions: 3               # number of hits required to trigger toggle
  sound_cue_max_gap_s: 0.6               # max time between hits to count as one gesture
  sound_cue_cooldown_s: 2.0              # debounce window after a toggle
  physical_cue_gpio_pin: null            # e.g. 17 on a Raspberry Pi; null = no hardware button

synthesis:
  engine: sinusoidal
  vocable_set:
    - aah
    - ooo
    - mmm
    - hey
  crossfade_ms: 30
  ddsp_model_path: null
  timbral_detune_cents: 6                # chorus-style detune used by timbral_thickening mode
  breathiness: 0.045                     # 0.0-0.2ish; amount of formant-shaped breath noise mixed in
  vibrato_rate_hz: 5.3                   # sung-vibrato rate on notes held longer than ~0.6s
  vibrato_depth_cents: 12                # sung-vibrato depth in cents

  texture:
    solo:
      reverb_amount: 0.08                # a touch of room, close-mic'd feel
    duet:
      num_voices: 2
      detune_spread_cents: 9.0
      timing_jitter_ms: 12.0
      formant_spread: 0.12               # 0-1, per-voice vocal-tract size variance
      reverb_amount: 0.16
      stereo_spread: 0.4
    choir:
      num_voices: 7                      # more voices = fuller, but costs CPU per note
      detune_spread_cents: 16.0          # how far the choir spreads in pitch around true pitch
      timing_jitter_ms: 28.0             # how loosely the choir's onsets scatter
      formant_spread: 0.22               # bigger = more "different people" character
      reverb_amount: 0.34                # concert-hall amount of wash
      stereo_spread: 1.0

timing:
  response_delay_ms: 70
  max_hold_ms: 4000

cree_tokenizer:
  enabled: false
  model_path: null
  phoneme_influence: 0.6

output:
  volume: 0.8
  speaker_resonance: false

logging:
  level: DEBUG