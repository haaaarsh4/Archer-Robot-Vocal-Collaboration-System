audio:
  sample_rate: 44100
  frame_size: 1024
  channels: 1
  dtype: float32
  input_device: null
  output_device: null

preprocessing:
  silence_threshold_db: -40
  normalize_target_rms: 0.1

pitch:
  method: yin                      # "yin" | "yinfft" | "rmvpe" 
  confidence_threshold: 0.3
  min_frequency: 65               
  max_frequency: 1200
  tolerance: 0.15                  
  jump_tolerance_cents: 80.0       # how far a reading can drift before it's treated as a new note rather than smoothed in
  rmvpe:
    model_path: "assets/rmvpe/rmvpe.pt"   
    prewarm: true                    
    device: cpu                     
    is_half: false                  
    context_seconds: 1.0            
    infer_stride_hops: 4             # was 1 (infer every single hop) -- on CPU, running the
                                     # full CNN+BiGRU that often can't keep up with real-time
                                     # audio, which is what caused the growing backlog/lag
                                     # (backend still reporting pitch well after playback ends).
                                     # Raise this further (e.g. 6-8) if it's still falling behind.
    voicing_threshold: 0.03         
    confidence_threshold: 0.15      

rhythm:
  onset_threshold: 0.1
  min_bpm: 40
  max_bpm: 240
  phrase_end_silence_ms: 800

harmony:
  detune_cents: 0
  scale_lock: true
  default_mode: unison_shadowing        
  fusion_mode: false                     
  fast_tempo_threshold_bpm: 120          
  sustain_frames_for_timbral: 30         
  silence_when_no_singer: false          

modes:
  octave_direction: -1                   
  delay_beats: 1.0                       
  drone_divisor: 2                       
  contour_window: 6                      
  contour_step_semitones: 2              
  call_response_semitones: 0             

protocol:
  start_enabled: true
  sensitive_phoneme_classes: []          
  sound_cue_enabled: true
  sound_cue_hz_range: [80, 140]          
  sound_cue_repetitions: 3               
  sound_cue_max_gap_s: 0.6               
  sound_cue_cooldown_s: 2.0              
  physical_cue_gpio_pin: null            

synthesis:
  engine: sinusoidal
  vocable_set:
    - aah
    - ooo
    - mmm
    - hey
  crossfade_ms: 30
  ddsp_model_path: null
  timbral_detune_cents: 6                # chorus-style detune used by timbral_thickening mode
  breathiness: 0.045                     # 0.0-0.2ish; amount of formant-shaped breath noise mixed in
  vibrato_rate_hz: 5.3                   # sung-vibrato rate on notes held longer than ~0.6s
  vibrato_depth_cents: 12                # sung-vibrato depth in cents

  neural:
    enabled: true               # flipped on -- was false, which is why nothing changed before. Requires neural_env/rvc_server.py sidecar running (GET /neural/status to confirm reachable:true)
    sidecar_url: "http://127.0.0.1:8801"
    sidecar_timeout_s: 5.0
    device: cpu                  # no GPU available -- switched from cuda:0. See note below: CPU inference is slow, budget for it.
    pitch_algo: rmvpe            # RVC's pitch tracker; rmvpe is the current best general choice
    index_rate: 0.66             # RVC retrieval-blend amount
    protect: 0.33                # protects unvoiced consonants/breath from being over-converted
    transpose_semitones: 0       # leave at 0 — our DSP source is already at the correct pitch
    max_latency_warn_s: 0.5      # log a warning if a single conversion call exceeds this
    model_paths:                 # one entry per choir "singer" — was pointing at a placeholder path, updated to the actual trained model from the screenshot
      - "assets/synthesis_models/mi-test.pth"
    index_paths:                 # parallel to model_paths — updated to match
      - "assets/synthesis_models/mi-test_added_IVF1003_Flat_nprobe_1_mi-test_v2.index"
    offline_render_timeout_s: 900  # max wait for the ONE whole-track sidecar call used by
                                    # the Upload-MP3 panel's Neural (offline render) mode --
                                    # this isn't a real-time budget, just a safety ceiling so
                                    # a stuck sidecar can't hang the request forever. Raise it
                                    # for longer tracks / slower CPUs.

  texture:
    solo:
      reverb_amount: 0.08                # a touch of room, close-mic'd feel
    duet:
      num_voices: 2
      detune_spread_cents: 9.0
      timing_jitter_ms: 12.0
      formant_spread: 0.12               # 0-1, per-voice vocal-tract size variance
      reverb_amount: 0.16
      stereo_spread: 0.4
    choir:
      num_voices: 7                      # more voices = fuller, but costs CPU per note
      detune_spread_cents: 16.0          # how far the choir spreads in pitch around true pitch
      timing_jitter_ms: 28.0             # how loosely the choir's onsets scatter
      formant_spread: 0.22               # bigger = more "different people" character
      reverb_amount: 0.34                # concert-hall amount of wash
      stereo_spread: 1.0

timing:
  response_delay_ms: 70
  max_hold_ms: 4000

cree_tokenizer:
  enabled: false
  model_path: null
  phoneme_influence: 0.6

output:
  volume: 0.8
  speaker_resonance: false

logging:
  level: DEBUG

# ============================================================
# Archer Chat (chatbot + RAG + spoken replies + "sing my idea")
# ============================================================
chat:
  backend: ollama                        # "ollama" | "llama_cpp"
  ollama_url: "http://127.0.0.1:11434"
  ollama_model: "llama3.1:8b-instruct-q4_K_M"   # matches what you already `ollama pull`ed
  gguf_path: null                        # only used if backend: llama_cpp
  temperature: 0.4
  max_tokens: 500

tts:
  # piper.download_voices saves into the CURRENT directory it's run from --
  # your terminal log shows you ran it from data/spoken_mode/, so that's
  # where en_US-lessac-medium.onnx (+ .onnx.json) actually landed. Adjust
  # this path if you later move the voice files or re-download elsewhere.
  voice_path: "data/spoken_mode/en_US-lessac-medium.onnx"

svs:
  diffsinger_url: "http://127.0.0.1:8802"   # only needed for the lyrics+melody path -- not set up yet
  diffsinger_timeout_s: 600
  default_voice_index: 0                    # index into synthesis.neural.model_paths above
