audio:
  sample_rate: 44100
  frame_size: 1024
  channels: 1
  dtype: float32
  input_device: null
  output_device: null

preprocessing:
  silence_threshold_db: -40
  normalize_target_rms: 0.1

pitch:
  engine: aubio_yin
  confidence_threshold: 0.3
  min_frequency: 80
  max_frequency: 1200

rhythm:
  onset_threshold: 0.1
  min_bpm: 40
  max_bpm: 240
  phrase_end_silence_ms: 800

harmony:
  default_interval: fifth
  intervals:
    unison: 0
    third: 4
    fifth: 7
    octave: 12
  detune_cents: 0
  scale_lock: true

synthesis:
  engine: sinusoidal
  vocable_set:
    - aah
    - ooo
    - mmm
    - hey
  crossfade_ms: 30
  ddsp_model_path: null

timing:
  response_delay_ms: 70
  max_hold_ms: 4000

cree_tokenizer:
  enabled: false
  model_path: null
  phoneme_influence: 0.6

output:
  volume: 0.8
  speaker_resonance: false

logging:
  level: DEBUG