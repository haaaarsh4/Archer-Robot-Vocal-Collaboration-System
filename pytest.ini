[pytest]
# hydra-core 1.0.7 ships a pytest plugin whose dataclasses fail to import on
# Python 3.12 (mutable default in JobConf). Nothing in this project imports
# hydra; the plugin is autoloaded from the environment and aborts collection
# before a single test runs. Disabling it is the narrow fix. Do not replace it
# by pinning Python or by patching site-packages.
addopts = -p no:hydra_pytest
testpaths = tests
